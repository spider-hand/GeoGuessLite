pre-commit:
  commands:
    ruff:
      run: cd server && uv run ruff check .

    eslint:
      run: cd client && pnpm lint

    prettier:
      run: cd client && pnpm format:check

    client-tests:
      run: cd client && pnpm test:browser --run

    server-tests:
      run: cd server && uv run pytest
