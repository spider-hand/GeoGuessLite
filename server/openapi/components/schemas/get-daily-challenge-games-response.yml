type: array
items:
  type: object
  additionalProperties: false
  required: [id, date, totalScore, totalDistanceKm, completedAt]
  properties:
    id:
      type: string
    date:
      type: string
      format: date
    totalScore:
      type: integer
      minimum: 0
      maximum: 25000
    totalDistanceKm:
      type: [number, "null"]
      minimum: 0
    completedAt:
      type: string
      format: date-time
