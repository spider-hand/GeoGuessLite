type: array
items:
  type: object
  additionalProperties: false
  required:
    - id
    - totalScore
    - totalDistanceKm
    - createdAt
    - completedAt
  properties:
    id:
      type: string
    totalScore:
      type: integer
      minimum: 0
      maximum: 25000
    totalDistanceKm:
      type: [number, "null"]
      minimum: 0
    createdAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
