type: object
additionalProperties: false
required:
  - userId
  - displayName
  - country
  - createdAt
  - updatedAt
properties:
  userId:
    type: string
  displayName:
    type: string
  country:
    type:
      - string
      - "null"
    pattern: ^[A-Z]{2}$
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
