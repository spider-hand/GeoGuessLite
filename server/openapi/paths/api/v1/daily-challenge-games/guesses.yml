parameters:
  - name: gameId
    in: path
    required: true
    schema:
      type: string
  - name: roundNumber
    in: path
    required: true
    schema:
      type: integer
      minimum: 1
      maximum: 5
post:
  operationId: createDailyChallengeGameGuess
  summary: Complete a daily challenge round with a guess or timeout
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../../components/schemas/create-daily-challenge-game-guess-request.yml
  responses:
    "200":
      description: Completed round
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/create-daily-challenge-game-guess-response.yml
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "401":
      description: Registered user authentication required
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "404":
      description: Daily challenge game not found
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "409":
      description: Round is not active or has not expired
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
