get:
  operationId: getDailyChallengeGames
  summary: List the current user's recent completed daily challenges
  security:
    - BearerAuth: []
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: sort_by
      in: query
      schema:
        type: string
        enum: [created_at, completed_at]
        default: completed_at
    - name: order_by
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    "200":
      description: Recent completed daily challenges
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/get-daily-challenge-games-response.yml
    "400":
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
post:
  operationId: createDailyChallengeGame
  summary: Create or resume today's daily challenge game
  security:
    - BearerAuth: []
  responses:
    "200":
      description: Existing ongoing daily challenge game
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/create-daily-challenge-game-response.yml
    "201":
      description: Daily challenge game created
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/create-daily-challenge-game-response.yml
    "400":
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "401":
      description: Registered user authentication required
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "404":
      description: Today's scheduled challenge is unavailable
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "409":
      description: Today's challenge has already been completed
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
