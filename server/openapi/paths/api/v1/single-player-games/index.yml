get:
  operationId: getSinglePlayerGames
  summary: List the current user's completed single-player games
  security:
    - BearerAuth: []
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: sort_by
      in: query
      schema:
        type: string
        enum: [created_at, completed_at]
        default: completed_at
    - name: order_by
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    "200":
      description: Completed single-player games
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/get-single-player-games-response.yml
    "400":
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
post:
  operationId: createSinglePlayerGame
  summary: Create a single-player game
  security:
    - BearerAuth: []
  responses:
    "201":
      description: Single-player game created
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/create-single-player-game-response.yml
    "400":
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
    "503":
      description: Playable images are unavailable
      content:
        application/json:
          schema:
            $ref: ../../../../components/schemas/error-response.yml
